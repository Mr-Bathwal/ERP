name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check procureflow eval seed tests
      - name: Tests
        # Fully offline: FakeERPClient, lexical policy retrieval, no keys.
        run: pytest tests -q
      - name: Evaluation harness against the fake ERP, diffed against the frozen baseline
        run: python eval/run_eval.py --tag ci --check-baseline
