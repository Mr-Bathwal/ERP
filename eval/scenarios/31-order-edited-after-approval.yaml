name: order_edited_while_awaiting_approval_is_not_submitted
input: seed/samples/req-over-threshold.txt
category: authority
why: >
  The run pauses with a Rs74,600 draft order. While it waits, someone edits
  the draft in ERPNext from 4 drums to 40. The approver then says yes to
  what they were shown. Before submitting, the agent reads the order back,
  its digest no longer matches the one the approval was bound to, and the
  order is not submitted.
approve: null
pause_then:
  tamper: {qty: {LUB-HYD-68: 40}}
  approve: true
  approver: proc.manager
  note: approved as shown
expect:
  state: blocked
  rules_cited: [R12]
  not_submitted: true
  reason_contains: changed after it was approved
