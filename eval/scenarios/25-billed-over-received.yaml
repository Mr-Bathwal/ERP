name: billed_over_received
input: seed/samples/req-short-delivery.txt
category: quantity / receipt
why: >
  All 60 rods arrived, so delivery is clean, but the invoice bills 70. Price
  matches the order and the receipt matches the order: only the third leg,
  invoice against receipt, sees it.
approve: true   # Rs74,400 is over the R1 ceiling
approver: proc.manager   # R12: Procurement Manager, up to Rs2,00,000
plan:
  invoice_qty: {STL-ROD-20: 70}
expect:
  state: completed_with_exceptions
  exceptions: [billed_over_received]
  rules_cited: [R11]
